

<!------------Home Page Layout-------------->

 <app-header-one></app-header-one>
<ng-container *ngIf="isInnerPage(); else mainLayout">
   <div class="inner-header">
    <!-- Page Header Start -->
    <div class="container-fluid bg-dark bg-img p-5 mb-5">
        <div class="row">
            <div class="col-12 text-center">
                <h1 class="display-4 text-uppercase text-white">{{ pageTitle }}</h1>
                <a href="">Home</a>
                <i class="far fa-square text-primary px-2"></i>
                <a routerLink="">{{ pageTitle }}</a>
            </div>
        </div>
    </div>
    <!-- Page Header End -->
  </div>
  <app-inner-layout></app-inner-layout>
</ng-container>
<ng-template #mainLayout>
  <app-main-layout></app-main-layout>
</ng-template>

 <app-footer-one></app-footer-one>

<!-- Hero Slider Start -->
<div class="position-relative">
  <!-- Carousel for backgrounds/images only -->
  <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
    <!-- Dot Indicators -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <div class="container-fluid bg-primary py-5 mb-5 hero-header hero-images-1"></div>
      </div>
      <div class="carousel-item">
        <div class="container-fluid bg-secondary py-5 mb-5 hero-header hero-images-2"></div>
      </div>
      <div class="carousel-item">
        <div class="container-fluid bg-success py-5 mb-5 hero-header hero-images-1"></div>
      </div>
    </div>
   
  </div>
  <!-- Static Content Overlay -->
  <div class="container py-5 position-absolute top-0 start-50 translate-middle-x w-100" style="z-index: 2;">
    <div class="row justify-content-start">
      <div class="col-lg-12 text-center text-lg-start">
        <h1 class="font-secondary text-primary mb-4">Super Crispy</h1>
        <h1 class="display-1 text-uppercase text-white mb-4">ORI CAKES</h1>
        <h1 class="text-uppercase text-white">Delicious Cakes For Every Occasions</h1>
        <div class="d-flex align-items-center justify-content-center justify-content-lg-start pt-5">
          <a routerLink="/order-now" class="btn btn-primary border-inner py-3 px-5 me-5">Order Now</a>
          <button type="button" class="btn-play" data-bs-toggle="modal"
            data-src="https://www.youtube.com/embed/8WI8H0lYlXo" data-bs-target="#videoModal">
            <span></span>
          </button>
          <h5 class="font-weight-normal text-white m-0 ms-4 d-none d-sm-block">Play Video</h5>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Hero Slider End -->

<!-- Video Modal Start -->
<div class="modal fade" id="videoModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content rounded-0">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Youtube Video</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!-- 16:9 aspect ratio -->
        <div class="ratio ratio-16x9">
          <iframe class="embed-responsive-item" src="https://www.youtube.com/embed/8WI8H0lYlXo" id="video" allowfullscreen allowscriptaccess="always"
            allow="autoplay"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Video Modal End -->
